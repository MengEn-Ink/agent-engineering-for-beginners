name: Review source freshness

on:
  schedule:
    - cron: '17 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-freshness-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check sources
        run: pnpm sources:check
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload freshness report
        uses: actions/upload-artifact@v4
        with:
          name: source-freshness-report
          path: reports/source-freshness.*
          if-no-files-found: error
          retention-days: 7

  report:
    needs: scan
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Download freshness report
        uses: actions/download-artifact@v4
        with:
          name: source-freshness-report
          path: reports

      - name: Create, update, or close freshness issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs')
            const report = JSON.parse(fs.readFileSync('reports/source-freshness.json', 'utf8'))
            const body = fs.readFileSync('reports/source-freshness.md', 'utf8')
            const title = '[Freshness] Source review required'
            const { owner, repo } = context.repo
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            })
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title)

            if (report.needs_review && existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body })
            } else if (report.needs_review) {
              await github.rest.issues.create({ owner, repo, title, body })
            } else if (existing) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                state: 'closed',
                body: `${body}\n\nAll automated findings are cleared.`,
              })
            }
